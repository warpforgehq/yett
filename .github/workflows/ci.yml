# Written for the standalone yett repository: this directory becomes the repo root on extraction.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      SOPS_VERSION: 3.13.3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Install sops (checksum-verified)
        run: |
          set -euo pipefail
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64)   asset="linux.amd64" ;;
            Linux-ARM64) asset="linux.arm64" ;;
            macOS-X64)   asset="darwin.amd64" ;;
            macOS-ARM64) asset="darwin.arm64" ;;
            *) echo "unsupported runner ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          base="https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}"
          file="sops-v${SOPS_VERSION}.${asset}"
          curl --fail --location --silent --show-error --output "$file" "$base/$file"
          curl --fail --location --silent --show-error --output checksums.txt "$base/sops-v${SOPS_VERSION}.checksums.txt"
          grep " ${file}\$" checksums.txt > checksums.one
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum --check checksums.one
          else
            shasum -a 256 --check checksums.one
          fi
          mkdir -p "$HOME/.local/bin"
          mv "$file" "$HOME/.local/bin/sops"
          chmod +x "$HOME/.local/bin/sops"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/sops" --version --disable-version-check

      - run: cargo fmt --check

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test
